    }
    return `<label>${f.l}</label><input id="f_${f.k}" type="${f.type||"text"}" placeholder="${f.l.replace(" *","")}">`;
  }).join("");

  document.getElementById("formArea").innerHTML = `

      <h2>${d.title}</h2>
      <h3>Taarifa / Details</h3>
      ${fieldsHtml}
      <h3>Masharti / Terms</h3>

/* ── SIGNATURE PADS ── */
function initSig(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  c.width = c.offsetWidth * dpr;
  c.height = 130 * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = "#0B1F45";
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  let drawing = false, hasInk = false;
  function pos(e){
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasInk = true; e.preventDefault(); }
  function end(){ drawing = false; }
  c.addEventListener("mousedown", start); c.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
  c.addEventListener("touchstart", start, {passive:false}); c.addEventListener("touchmove", move, {passive:false}); c.addEventListener("touchend", end);
  sigPads[id] = { canvas: c, hasInk: () => hasInk, reset: () => { hasInk = false; } };
}
function clearSig(id){
  const p = sigPads[id];
  const ctx = p.canvas.getContext("2d");
  ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
  p.reset();
}

/* ── SAVE TO SUPABASE ── */
async function saveContract(){
  const st = document.getElementById("saveStatus");
  const d = DOCS[currentDoc];
  const formData = {};
  d.fields.forEach(f => { formData[f.k] = (document.getElementById("f_"+f.k)||{}).value || ""; });
  if(!formData.jina || !formData.jina.trim()){
    st.className = "status err"; st.textContent = "× Jaza jina la mfanyakazi / Enter employee name"; return;
  }
  if(!sigPads.sigEmployee.hasInk()){
    st.className = "status err"; st.textContent = "× Mfanyakazi lazima atie sahihi / Employee must sign"; return;
  }
  st.className = "status ok"; st.textContent = "Inahifadhi... / Saving...";
  const rec = {
    doc_type: currentDoc,
    employee_name: formData.jina.trim(),
    employee_phone: formData.simu || "",
    form_data: formData,
    employee_signature: sigPads.sigEmployee.canvas.toDataURL("image/png"),
    employer_signature: sigPads.sigEmployer.hasInk() ? sigPads.sigEmployer.canvas.toDataURL("image/png") : null,
  };
  try {
    const res = await fetch(SB_URL + "/rest/v1/signed_contracts", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, Prefer: "return=minimal" },
      body: JSON.stringify(rec)
    });
    if(res.ok){
      st.className = "status ok";
      st.textContent = "✓ Mkataba umehifadhiwa kikamilifu! / Contract saved successfully!";
      setTimeout(()=>renderForm(currentDoc), 2500);
    } else {
      const t = await res.text();
      st.className = "status err"; st.textContent = "× Hitilafu: " + t.slice(0,120);
    }
  } catch(e){
    st.className = "status err"; st.textContent = "× Mtandao umekataa / Network error: " + e.message;
  }
}

/* ── RECORDS ── */

renderForm("muda_mfupi");
</script>
