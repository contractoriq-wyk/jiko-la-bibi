<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajira Digital — Jiko La Bibi JJJ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F0F4F8;color:#0B1F45;padding-bottom:40px}
.hdr{background:linear-gradient(135deg,#0B1F45,#1a3a6e);color:#fff;text-align:center;padding:18px 14px;position:relative}
.hdr h1{font-family:Georgia,serif;font-size:20px;color:#D4AF37}
.hdr p{font-size:11px;opacity:0.7;margin-top:3px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:150px;padding:12px 8px;border:2px solid rgba(11,31,69,0.15);background:#fff;border-radius:12px;font-size:12px;font-weight:700;color:rgba(11,31,69,0.55);cursor:pointer}
.tabs button.on{border-color:#B8860B;background:rgba(184,134,11,0.1);color:#B8860B}
.card{background:#fff;border:1px solid rgba(11,31,69,0.1);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(11,31,69,0.06)}
h2{font-family:Georgia,serif;font-size:16px;color:#B8860B;margin-bottom:10px}
h3{font-size:13px;color:#0B1F45;margin:14px 0 8px;border-bottom:2px solid rgba(184,134,11,0.3);padding-bottom:4px}
label{display:block;font-size:11px;font-weight:700;color:rgba(11,31,69,0.6);margin:8px 0 3px;text-transform:uppercase;letter-spacing:0.5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid rgba(11,31,69,0.2);border-radius:10px;font-size:14px;color:#0B1F45;outline:none;font-family:Arial}
input:focus,select:focus{border-color:#B8860B}
.terms{background:rgba(11,31,69,0.03);border-radius:10px;padding:12px;font-size:13px;line-height:1.7;max-height:260px;overflow-y:auto;margin:8px 0}
.terms li{margin:0 0 6px 18px}
.terms ol li{margin-left:22px}
.sig-area{border:2px dashed rgba(184,134,11,0.5);border-radius:12px;background:#FFFDF5;position:relative;margin-top:6px}
.sig-area canvas{width:100%;height:130px;display:block;touch-action:none;border-radius:10px}
.sig-clear{position:absolute;top:6px;right:6px;background:rgba(198,40,40,0.1);color:#C62828;border:1px solid rgba(198,40,40,0.3);border-radius:6px;padding:3px 9px;font-size:10px;font-weight:700;cursor:pointer}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-gold{background:linear-gradient(135deg,#B8860B,#8a6008);color:#fff;box-shadow:0 4px 16px rgba(184,134,11,0.4)}
.btn-green{background:linear-gradient(135deg,#1B7A20,#0d5012);color:#fff}
.btn-grey{background:rgba(11,31,69,0.06);color:rgba(11,31,69,0.6)}
.btn:disabled{background:rgba(11,31,69,0.08);color:rgba(11,31,69,0.3);cursor:default;box-shadow:none}
.status{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;margin-top:10px;display:none}
.status.ok{background:rgba(27,122,32,0.1);color:#1B7A20;display:block}
.status.err{background:rgba(198,40,40,0.1);color:#C62828;display:block}
.rec{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid rgba(11,31,69,0.06)}
.rec:last-child{border-bottom:none}
.rec-icon{width:36px;height:36px;border-radius:50%;background:rgba(184,134,11,0.12);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:13px;font-weight:700}
.rec-meta{font-size:11px;color:rgba(11,31,69,0.5);margin-top:1px}
.rec-btn{background:rgba(21,101,192,0.1);color:#1565C0;border:1px solid rgba(21,101,192,0.3);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
@media print{
  body{background:#fff;padding:0}
  .hdr,.tabs,.no-print,.sig-clear,.btn,.status{display:none !important}
  .card{box-shadow:none;border:none;page-break-inside:avoid}
  .terms{max-height:none;overflow:visible;background:none}
  input,select{border:none;border-bottom:1px solid #999;border-radius:0;font-weight:700}
  .print-header{display:block !important;text-align:center;margin-bottom:18px}
}
.print-header{display:none}
.print-header h1{font-family:Georgia,serif;font-size:20px;color:#0B1F45}
.print-header p{font-size:11px;color:#666}

body::before{
  content:"UNYAMWEZINI JIKO LA BIBI JJJ";
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-35deg);
  font-size:min(7vw,52px);
  font-weight:900;
  font-family:Georgia,serif;
  color:rgba(184,134,11,0.08);
  white-space:nowrap;
  pointer-events:none;
  z-index:0;
  letter-spacing:2px;
  user-select:none;
}
.wrap,.hdr{position:relative;z-index:1}
body.locked .tabs button:not([data-doc=omba]):not([data-doc=sera]){display:none}
.unlock{margin:26px 0 10px;text-align:center}
.unlock a{font-size:12px;color:rgba(11,31,69,0.35);text-decoration:none;cursor:pointer}
.unlock .box{display:none;gap:6px;justify-content:center;margin-top:8px}
.unlock .box.open{display:flex}
.unlock input{padding:10px;border:2px solid rgba(11,31,69,0.15);border-radius:10px;font-size:14px;width:150px;text-align:center;text-transform:uppercase}
.unlock button{padding:10px 14px;border:0;border-radius:10px;background:#B8860B;color:#fff;font-weight:700;cursor:pointer}
.unlock .msg{font-size:12px;color:#b00020;margin-top:6px;min-height:14px}
body.locked .no-lock{display:none}



/* ── Scroll-style policy page (light-blue corporate) ── */
.scroll-wrap{margin:4px 0 8px}
.scroll-rod{position:relative;z-index:3;height:24px;margin:0 6px;border-radius:12px;background:linear-gradient(#08142e,#1f3f7a 22%,#8db3e6 48%,#2a4d8c 72%,#06112a);box-shadow:0 4px 8px rgba(8,20,46,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.scroll-rod::before,.scroll-rod::after{content:"";position:absolute;top:-5px;width:16px;height:34px;border-radius:8px;background:linear-gradient(90deg,#8a6a12,#e8c547 45%,#9a7414);box-shadow:0 2px 5px rgba(8,20,46,.45)}
.scroll-rod::before{left:-8px}.scroll-rod::after{right:-8px}
.scroll-paper{position:relative;z-index:1;margin:-6px 16px;padding:30px 16px 26px;overflow:hidden;color:#0B1F45;font-family:Georgia,"Times New Roman",serif;
 background:radial-gradient(ellipse at 15% 8%,rgba(255,255,255,.65),transparent 45%),radial-gradient(ellipse at 90% 95%,rgba(44,79,143,.16),transparent 50%),linear-gradient(#eaf3fd,#d6e6f8 55%,#e7f1fc);
 box-shadow:inset 0 16px 16px -16px rgba(11,31,69,.5),inset 0 -16px 16px -16px rgba(11,31,69,.5),inset 14px 0 18px -16px rgba(11,31,69,.22),inset -14px 0 18px -16px rgba(11,31,69,.22),0 2px 10px rgba(11,31,69,.18)}
.scroll-paper::before{content:"";position:absolute;inset:9px;border:3px double rgba(11,31,69,.5);pointer-events:none;z-index:2}
.scroll-paper .wm{position:absolute;left:50%;top:50%;width:62%;max-width:300px;transform:translate(-50%,-50%);opacity:.08;pointer-events:none;z-index:0}
.scroll-paper>*:not(.wm){position:relative;z-index:1}
.scroll-paper h2{margin:6px 0 2px;text-align:center;font-family:Georgia,serif;font-size:19px;letter-spacing:1.5px;color:#0B1F45;text-transform:uppercase}
.scroll-orn{text-align:center;color:#b8860b;letter-spacing:8px;font-size:13px;margin:4px 0 10px}
.scroll-paper .intro{text-align:center;font-size:13px;line-height:1.6;margin:0 0 14px;color:#1d3557}
.scroll-paper ol{list-style:none;counter-reset:sc;padding:0;margin:0}
.scroll-paper li{counter-increment:sc;position:relative;padding:0 6px 0 40px;margin:0 0 15px;font-size:13.5px;line-height:1.65;overflow-wrap:anywhere}
.scroll-paper li::before{content:counter(sc);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:900 13px sans-serif;color:#fff;background:radial-gradient(circle at 35% 30%,#3a67b5,#0B1F45 75%);border:2px solid #D4AF37;box-sizing:border-box;box-shadow:0 1px 3px rgba(8,20,46,.4)}
.scroll-paper li b{color:#0B1F45}
.scroll-paper li small{display:block;margin-top:3px;font-style:italic;font-size:12px;color:#3d5a80}
.scroll-seal{display:flex;flex-direction:column;align-items:center;margin:20px 0 4px;text-align:center}
.scroll-seal img{width:104px;height:auto;transform:rotate(-4deg);filter:drop-shadow(0 3px 6px rgba(8,20,46,.45))}
.scroll-seal .cap{margin-top:6px;font:800 11px sans-serif;letter-spacing:2px;color:#0B1F45;text-transform:uppercase}
.scroll-seal .cap2{font:italic 11.5px Georgia,serif;color:#3d5a80;margin-top:2px}
.scroll-line{width:62%;border-top:1.5px solid rgba(11,31,69,.55);margin:18px auto 3px}
.scroll-actions{display:flex;gap:10px;margin:16px 0 4px}
.scroll-actions .btn{flex:1;margin:0;padding:12px 8px;font-size:13px;background:#dbe9f8;color:#0B1F45;border:1px solid #9dbfe6}
.btn-blue{background:linear-gradient(135deg,#2f6db5,#0B1F45) !important;color:#fff !important}
.share-box{display:none;margin-top:10px;padding:12px;border:1px solid rgba(11,31,69,.2);border-radius:12px;background:#fff;font-size:12px}
.share-box input{width:100%;box-sizing:border-box;margin:6px 0 8px;font-size:12px}
.print-only{display:none}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before{display:none !important}
  .scroll-paper{box-shadow:none;overflow:visible;margin:-6px 4px}
  .scroll-paper li,.scroll-seal{break-inside:avoid}
  .scroll-actions,.share-box{display:none !important}
  .print-only{display:block;text-align:center;font:11px sans-serif;color:#3d5a80;margin-top:10px}
}
</style>
</head>

    terms: `<p style="margin-bottom:8px"><b>Sisi wadau watano (5) waanzilishi wa Unyamwezini Jiko La Bibi JJJ tunakubaliana kufuata muundo huu wa uongozi wa kijeshi (military-style) ili kufanikisha biashara yetu. Kila mdau anasimamia kitengo kimoja na anawajibika kikamilifu kwa kitengo chake.</b></p>
    <p style="font-weight:bold;color:#B8860B;margin:10px 0 4px">VITENGO VITANO / THE FIVE DEPARTMENTS</p>
    <ul>
      <li><b>1. Operesheni za Jikoni / Kitchen Operations</b> — Kamanda wa Mstari wa Mbele. Anasimamia: ubora wa chakula, viwango vya mapishi, ratiba ya kupika, kiasi cha sahani, usafi wa jikoni, na usalama wa chakula. Malalamiko ya ladha au mwonekano wa chakula ni jukumu lake.</li>
      <li><b>2. Ugavi na Ununuzi / Supply & Procurement</b> — Afisa wa Ugavi. Anasimamia: ununuzi wa malighafi kwa bei nzuri, wasambazaji, kufuatilia stoki ili kisiishe, kupunguza upotevu, na uhifadhi. Anaingiza gharama kwenye Msimamizi.</li>
      <li><b>3. Mauzo na Wateja / Sales & Customer Experience</b> — Afisa wa Uwanjani. Anasimamia: kupokea na kutimiza oda (WhatsApp, ana kwa ana, tovuti), kasi ya huduma, kuridhika kwa wateja, na kushughulikia malalamiko. Anaishi kwenye tabu ya Maagizo.</li>
      <li><b>4. Fedha na Utawala / Finance & Administration</b> — Mhazini Mkuu. Anasimamia: hesabu za pesa kila siku, kuingiza mauzo na gharama kwenye Msimamizi, mishahara (Wafanyakazi), malengo, mikataba (Ajira), leseni, na ripoti. Hakuna jambo la kifedha bila idhini yake.</li>
      <li><b>5. Ukuaji na Masoko / Growth & Marketing</b> — Afisa wa Ujasusi na Upanuzi. Anasimamia: mitandao ya kijamii, matangazo, tovuti, ushirikiano na wadau wapya, bidhaa mpya, na kufuatilia washindani. Anajenga kesho wakati wengine wanaendesha leo.</li>
    </ul>
    <p style="font-weight:bold;color:#B8860B;margin:10px 0 4px">KANUNI ZA UONGOZI / LEADERSHIP RULES</p>
    <ul>
      <li>Kila mdau ana lane yake wazi — tatizo likitokea, tunajua nani anahusika. Hakuna "nilidhani wewe unashughulikia."</li>
      <li>Kila mdau atajifunza misingi ya kitengo cha mwenzake (cross-training) — mtu akiugua, kazi isisimame.</li>
      <li>Maamuzi makubwa ya biashara yatafanywa kwa makubaliano ya wadau wengi (angalau 3 kati ya 5).</li>
      <li>Mgawanyo wa faida na majukumu ya kifedha yataandikwa kwenye kiambatisho tofauti na kukubaliwa na wote.</li>
      <li>Kila mdau atatunza siri za biashara na kufanya kazi kwa uaminifu kwa manufaa ya wote.</li>
      <li>Mdau anayetaka kuondoka atatoa taarifa ya maandishi ya siku sitini (60) na mgawanyo wake utajadiliwa kwa haki.</li>
      <li>Migogoro itatatuliwa kwa mazungumzo ya pande zote kabla ya hatua nyingine yoyote.</li>
    </ul>
    <p style="margin-top:8px"><b>Kwa kutia sahihi, ninakubali kusimamia kitengo changu kwa uadilifu na kufuata kanuni zote za uongozi za Unyamwezini Jiko La Bibi JJJ.</b></p>`
  },
  sera: {
    title: "SERA ZA KAZI ZA KAMPUNI — KUKUBALI",
    fields: [
      {k:"jina",l:"Jina la Mfanyakazi *"},{k:"simu",l:"Namba ya Simu"},

    ],
    terms: `<ol>
      <li><b>Mahudhurio:</b> Fika dakika 15 kabla ya zamu. Kuchelewa bila taarifa mara 3/mwezi = onyo la maandishi.<br><small>Attendance: arrive 15 minutes before your shift. Late without notice 3 times a month = written warning.</small></li>
      <li><b>Usafi wa Chakula:</b> Nawa mikono kwa sabuni, vaa mavazi safi, funika nywele, osha vyombo mara baada ya matumizi. Mgonjwa asishike chakula.<br><small>Food hygiene: wash hands with soap, wear clean clothes, cover hair, wash utensils right after use. A sick person must not handle food.</small></li>
      <li><b>Wateja Wote Sawa:</b> Tunahudumia wateja wote kwa usawa, heshima na utu — bila upendeleo kwa mteja mmoja, bila kuangalia kabila, dini, jinsia, hali ya maisha au mwonekano. Hakuna mteja anayepewa bei, huduma, kipaumbele au punguzo la siri nje ya utaratibu wa biashara. Tabasamu, heshima, na usibishane — mwite Mwajiri.<br><small>All customers are equal: we serve every customer equally, with respect and dignity. No favoritism toward any single customer, and no discrimination. No secret prices, discounts or priority outside the business's rules. Smile, be respectful, never argue — call the Employer.</small></li>
      <li><b>Pombe Kazini — Hairuhusiwi Kabisa:</b> Mfanyakazi haruhusiwi kunywa pombe wala kuwa amelewa akiwa kazini (ndani ya zamu, wakati wa kuhudumia, au kwenye eneo la biashara akiwa na sare/majukumu). Pia hairuhusiwi kukubali au kunywa pombe anayonunuliwa na mteja akiwa kazini. Kukiuka = hatua ya kinidhamu hadi kufukuzwa. Madawa ya kulevya hayaruhusiwi kabisa.<br><small>Alcohol on duty is strictly prohibited: no drinking and no being intoxicated during a shift, while serving, or at the premises on duty. Staff may not accept or drink alcohol bought by customers while working. Violation = disciplinary action up to dismissal. Illegal drugs are never allowed.</small></li>
      <li><b>Siasa na Dini — Hakuna Mijadala Kazini:</b> Mgahawa wetu ni mahali pa watu wote, wa kila imani na kila mtazamo. Wafanyakazi na wateja hawaruhusiwi kuanzisha mijadala, mabishano, kampeni, mahubiri au kushawishi wengine kuhusu siasa au dini ndani ya eneo la biashara au wakati wa kazi — ikiwemo kuvaa au kutoa nembo, vipeperushi na ujumbe wa vyama au makundi ya kidini kwa wateja. Imani na msimamo binafsi wa kila mtu unaheshimiwa; kinachozuiwa ni mijadala na kushawishi. Mteja akianzisha mada hizo, mfanyakazi ajibu kwa upole, asibishane wala kuchukua upande, abadilishe mada kwa heshima, na amwite Mwajiri ikiwa mteja ataendelea. Mteja anayeendelea kusumbua wengine anaweza kuombwa kwa heshima aache au aondoke. Kukiuka kwa mfanyakazi = hatua za kinidhamu.<br><small>Politics and religion — no debates at work: our restaurant welcomes everyone of every faith and viewpoint. Staff and customers may not start debates, arguments, campaigns, preaching or attempts to persuade others about politics or religion on the premises or while on duty — including handing out or displaying party or religious-group materials, badges or messages to customers. Everyone's personal beliefs are respected; what is not allowed is the debating and persuading. If a customer raises these topics, staff reply politely, do not argue or take sides, steer the conversation back with respect, and call the Employer if it continues. A customer who keeps disturbing others may be politely asked to stop or leave. Violation by staff = disciplinary action.</small></li>
      <li><b>Kufuata Sheria:</b> Tunafanya kazi kwa mujibu wa sheria za Tanzania na masharti ya leseni ya biashara. Hatuuzi pombe kwa watoto au kinyume na saa na masharti yanayoruhusiwa na serikali. Mfanyakazi asifanye kitu chochote kinyume cha sheria kwa jina la biashara.<br><small>Legal compliance: we follow Tanzanian law and our business licence conditions. We do not sell alcohol to minors or outside the hours and rules the government allows. No one may do anything illegal in the name of the business.</small></li>
      <li><b>Fedha:</b> Pesa zihesabiwe kila siku. Lipa Namba ithibitishwe kabla ya kukabidhi chakula. Kila mauzo yaandikwe — hakuna kutoa bure au kupunguza bei bila idhini ya Mwajiri. Wizi = kufukuzwa mara moja + hatua za kisheria.<br><small>Money: cash counted daily; confirm Lipa Namba payment before handing over food. Every sale must be recorded — no free items or price cuts without the Employer's approval. Theft = immediate dismissal + legal action.</small></li>
      <li><b>Nidhamu na Heshima:</b> Hakuna lugha chafu, ugomvi, unyanyasaji au vitisho — kwa wateja au wafanyakazi wenzako. Zawadi au rushwa kutoka kwa wateja ili kupata huduma maalum hairuhusiwi. Simu za binafsi kwa kiasi.<br><small>Discipline and respect: no bad language, fighting, harassment or threats — toward customers or coworkers. No accepting gifts or bribes for special treatment. Personal phone use kept minimal.</small></li>
      <li><b>Siri:</b> Mapishi, bei, mauzo, na taarifa za wateja ni siri — hata baada ya kuacha kazi.<br><small>Confidentiality: recipes, prices, sales and customer information are secret — even after leaving.</small></li>
      <li><b>Likizo:</b> Ruhusa ya dharura kwa huruma. Likizo ndefu ipangwe wiki 2 kabla.<br><small>Leave: emergency leave is granted with compassion. Plan long leave 2 weeks ahead.</small></li>
      <li><b>Hatua za Kinidhamu:</b> 1) Onyo la mdomo 2) Onyo la maandishi 3) Kusimamishwa bila malipo 4) Kufukuzwa. Makosa makubwa (wizi, pombe kazini, kubagua wateja kwa makusudi, kushawishi wateja kisiasa au kidini, unyanyasaji) yataruka hatua.<br><small>Discipline: 1) verbal warning 2) written warning 3) unpaid suspension 4) dismissal. Serious offences (theft, alcohol on duty, deliberate favoritism/discrimination, pushing politics or religion on customers, harassment) may skip steps.</small></li>
      <li><b>Muundo wa Uongozi:</b> Biashara ina vitengo vitano — Jikoni, Ugavi, Mauzo, Fedha, na Masoko. Kila mfanyakazi atajua kitengo chake na msimamizi wake, na atatoa taarifa kwa msimamizi wa kitengo chake. Heshima itolewe kwa wasimamizi wote.<br><small>Structure: five units — Kitchen, Supply, Sales, Finance and Marketing. Everyone knows their unit and supervisor and reports to them. Respect all supervisors.</small></li>
      <li><b>Ushirikiano na Ubunifu:</b> Tunashirikiana kufikia malengo yetu ya pamoja. Wafanyakazi wanahimizwa kutumia ubunifu kutatua matatizo, na kumshauri msimamizi baada tu ya kujaribu njia zote nyingine. (Masuala ya usalama, wizi, unyanyasaji au dharura yatolewe taarifa mara moja.)<br><small>Teamwork and creativity: we collaborate to achieve our common goals. Team members are encouraged to use creative problem-solving and should consult a supervisor only after exhausting all other efforts. (Safety, theft, harassment or emergencies must be reported immediately.)</small></li>
    </ol>
    <p style="margin-top:8px"><b>Kwa kutia sahihi, ninathibitisha nimesoma, nimeelewa, na ninakubali kufuata Sera zote za Kazi.</b></p>`
  }

let currentDoc = "omba";
const STAFF_CODE = "UJLBJ3";
function applyLock(locked){
  document.body.classList.toggle("locked", locked);
  document.getElementById("hdrSub").innerHTML = locked
    ? "Unyamwezini Jiko La Bibi JJJ — Karibu! Omba kazi hapa / Welcome! Apply for a job here"
    : "Unyamwezini Jiko La Bibi JJJ — Karibu! Jaza fomu ya ajira hapa / Welcome! Apply &amp; sign here";
  const bar = document.getElementById("unlockBar");
  if(bar) bar.style.display = locked ? "" : "none";
  if(locked && currentDoc!=="omba" && currentDoc!=="sera"){
    currentDoc="omba";
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.doc==="omba"));
    renderApply();
  }
}
function toggleUnlock(){
  document.getElementById("unlockBox").classList.toggle("open");
  const i=document.getElementById("unlockCode"); if(i) i.focus();
}
function tryUnlock(){
  const v=(document.getElementById("unlockCode").value||"").trim().toUpperCase();
  if(v===STAFF_CODE){
    try{ sessionStorage.setItem("jiko_staff","1"); }catch(e){}
    applyLock(false);
  } else {
    document.getElementById("unlockMsg").textContent="Code si sahihi / Wrong code";
  }
}
function initLock(){
  let ok=false;
  try{
    const q=new URLSearchParams(location.search).get("code");
    if(q && q.trim().toUpperCase()===STAFF_CODE){ sessionStorage.setItem("jiko_staff","1"); ok=true; }
    else if(sessionStorage.getItem("jiko_staff")==="1") ok=true;
  }catch(e){}
  applyLock(!ok);
}
let sigPads = {};

function switchDoc(doc, btn){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  currentDoc = doc;
  if(doc==="omba") renderApply(); else if(doc==="sera" && document.body.classList.contains("locked")) renderPolicy(); else renderForm(doc);
}

function policyUrl(){ return location.origin + location.pathname + "?src=wom#sera"; }
async function sharePolicy(){
  const data = { title:"Sera za Kazi — Unyamwezini Jiko La Bibi JJJ", text:"Sera za Kazi / Our Work Policies — Unyamwezini Jiko La Bibi JJJ", url:policyUrl() };
  try{ if(navigator.share){ await navigator.share(data); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  const b = document.getElementById("shareBox"); if(b){ b.style.display = "block"; b.scrollIntoView({behavior:"smooth",block:"nearest"}); }
}
async function copyPolicyUrl(btn){
  const i = document.getElementById("shareUrl"); let ok = false;
  try{ await navigator.clipboard.writeText(i.value); ok = true; }catch(e){ try{ i.select(); ok = document.execCommand("copy"); }catch(e2){} }
  btn.textContent = ok ? "✅ Imenakiliwa / Copied" : "Bonyeza kiungo kisha nakili / Tap the link and copy";
}

/* Tidy any Tanzanian phone format into +255XXXXXXXXX; returns "" if it can't be a real number */
function normPhone(raw){
  raw = String(raw||"").trim(); const plus = raw.startsWith("+");
  let d = raw.replace(/[^0-9]/g,"");
  if(d.startsWith("00")) d = d.slice(2); else if(plus && !d.startsWith("255") && d.length>=9 && d.length<=15) return "+"+d; // other country
  if(d.startsWith("255") && d.length===12) d = d.slice(3);
  else if(d.startsWith("0") && d.length===10) d = d.slice(1);
  else if(d.length!==9) return "";
  return /^[67]\d{8}$/.test(d) ? "+255"+d : "";
}

async function submitApply(){
  if(!hiringOpen){ renderClosed(); return; }
  const g = id => (document.getElementById(id)||{}).value||"";
  const st = document.getElementById("a_status"), btn = document.getElementById("a_btn");
  if(g("a_hp")) return; // spam trap
  const name = g("a_name").trim(), phone = g("a_phone").trim();
  if(name.length<2){ st.className="status err"; st.textContent="× Andika jina lako / Enter your name"; return; }
  const phoneN = normPhone(phone);
  if(!phoneN){ st.className="status err"; st.textContent="× Namba si sahihi. Tumia tarakimu 10, mfano 0712345678 / Invalid number — use 10 digits, e.g. 0712345678"; return; }
  if(!g("a_smart")){ st.className="status err"; st.textContent="× Jibu kama una simu janja na WhatsApp / Tell us if you have a smartphone with WhatsApp"; return; }
  if(g("a_smart")!=="yes"){ st.className="status err"; st.textContent="× Samahani — kazi hii inahitaji simu janja na WhatsApp kwa mawasiliano na mafunzo. / Sorry — this job requires a smartphone with WhatsApp for communication and training."; return; }
  const age = parseInt(g("a_age"),10);
  if(!(age>0)){ st.className="status err"; st.textContent="× Weka umri wako / Enter your age"; return; }
  if(age<18){ st.className="status err"; st.textContent="× Lazima uwe na miaka 18 au zaidi / You must be 18 or older"; return; }
  if(age>70){ st.className="status err"; st.textContent="× Umri si sahihi / Age is not valid"; return; }
  if(!g("a_gender")){ st.className="status err"; st.textContent="× Chagua jinsia / Choose gender"; return; }
  if(!g("a_role")){ st.className="status err"; st.textContent="× Chagua kazi unayoomba / Choose the job you want"; return; }
  if(!g("a_edu")){ st.className="status err"; st.textContent="× Chagua kiwango cha elimu / Choose your education level"; return; }
  const sal = parseInt(String(g("a_sal")).replace(/[^\d]/g,""),10);
  if(!(sal>0)){ st.className="status err"; st.textContent="× Andika mshahara unaotaka (TZS kwa mwezi) / Enter the monthly salary you want"; return; }
  if(sal>10000000){ st.className="status err"; st.textContent="× Mshahara si sahihi / Salary does not look right"; return; }
  if(!g("a_study")){ st.className="status err"; st.textContent="× Chagua taaluma uliyosomea / Choose your field of study"; return; }
  if(!g("a_prob")){ st.className="status err"; st.textContent="× Jibu kuhusu siku 60 za majaribio / Answer the 60-day probation question"; return; }
  if(g("a_area").trim().length<2){ st.className="status err"; st.textContent="× Andika unapoishi sasa / Enter where you live now"; return; }
  if(!g("a_knows")){ st.className="status err"; st.textContent="× Jibu kama unafahamu Goba Njia Nne / Tell us if you know our location"; return; }
  let wa = g("a_wa") || "yes";
  if(wa==="other"){ const w2 = normPhone(g("a_wanum")); if(!w2){ st.className="status err"; st.textContent="× Namba ya WhatsApp si sahihi / WhatsApp number is not valid"; return; } wa = w2; }
  try{ const last=+localStorage.getItem("ajira_applied_at")||0; if(Date.now()-last<60000){ st.className="status err"; st.textContent="× Subiri dakika moja kisha ujaribu tena / Please wait a minute"; return; } }catch(e){}
  btn.disabled = true; st.className="status ok"; st.textContent="Inatuma... / Sending...";
  let source = g("a_src"); const sx = g("a_srcx").trim(); if(source && sx && source.indexOf("Other")>-1) source = (source+": "+sx).slice(0,80);
  const rec = { name, phone:phoneN, whatsapp:wa, source, age:String(age), gender:g("a_gender"), knows_location:g("a_knows"), role_wanted:g("a_role"), education:g("a_edu"), study_field:(g("a_study")+(g("a_studyx").trim()?": "+g("a_studyx").trim():"")).slice(0,120), probation_ok:g("a_prob"), salary_wanted:String(sal), area:g("a_area").trim(), experience:g("a_exp").trim(), available_from:g("a_start").trim(), message:g("a_msg").trim(), status:"new" };
  try{
    const post = body => fetch(SB_URL + "/rest/v1/job_applicants", { method:"POST",
      headers:{ "Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, Prefer:"return=minimal" }, body:JSON.stringify(body) });
    let res = await post(rec);
    for(let i=0; i<6 && !res.ok; i++){ // optional columns not created yet? never lose an applicant — resend without them
      const t0 = await res.clone().text(); const r2 = Object.assign({}, rec); let cut = false;
      if(/whatsapp/i.test(t0) && "whatsapp" in rec){ delete r2.whatsapp; r2.message = ("[WhatsApp: "+rec.whatsapp+"] "+r2.message).slice(0,300); delete rec.whatsapp; cut = true; }
      if(/source/i.test(t0) && "source" in rec){ delete r2.source; delete rec.source; cut = true; }
      if(/\b(age|gender|knows_location)\b/i.test(t0) && "age" in rec){ // keep the info: fold it into the message
        r2.message = ("[Umri "+rec.age+" · "+rec.gender.split(" / ")[0]+" · Goba: "+rec.knows_location.split(",")[0].split(" / ")[0]+"] "+r2.message).slice(0,300);
        delete r2.age; delete r2.gender; delete r2.knows_location; delete rec.age; delete rec.gender; delete rec.knows_location; cut = true; }
      if(/\b(education|salary_wanted)\b/i.test(t0) && "education" in rec){ // columns not added yet: fold into the message so nothing is lost
        r2.message = ("[Elimu: "+rec.education.split(" / ")[0]+" · Mshahara: TZS "+rec.salary_wanted+"] "+r2.message).slice(0,300);
        delete r2.education; delete r2.salary_wanted; delete rec.education; delete rec.salary_wanted; cut = true; }
      if(/\b(study_field|probation_ok)\b/i.test(t0) && "probation_ok" in rec){ // columns not added yet: fold into the message
        r2.message = ("[Taaluma: "+rec.study_field.split(" / ")[0]+" · Majaribio 60: "+rec.probation_ok.split(",")[0].split(" / ")[0]+"] "+r2.message).slice(0,300);
        delete r2.study_field; delete r2.probation_ok; delete rec.study_field; delete rec.probation_ok; cut = true; }
      if(!cut) break;
      Object.assign(rec, r2); res = await post(rec);
    }
    if(res.ok){
      try{ localStorage.setItem("ajira_applied_at", String(Date.now())); }catch(e){}
      document.getElementById("formArea").innerHTML = `<div class="card" style="text-align:center"><h2>✅ Ombi Lako Limepokelewa!</h2><p style="font-size:13px;line-height:1.7">Asante, <b>${esc(name)}</b>. Tutakutafuta kwa WhatsApp au simu ukichaguliwa kwa mahojiano.<br><span style="opacity:.75">Thank you! We will contact you on WhatsApp or phone if we would like to interview you.</span></p></div>`;
    } else {
      const closedNow = await (async()=>{ try{ const r=await fetch(SB_URL+"/rest/v1/site_flags?id=eq.main&select=hiring_open",{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}}); const j=await r.json(); return j&&j[0]&&j[0].hiring_open===false; }catch(e){ return false; } })();
      if(closedNow){ hiringOpen=false; renderClosed(); return; }
      btn.disabled = false; st.className="status err"; st.textContent="× Imeshindwa kutuma. Jaribu tena. / Could not send. Please try again.";
    }
  }catch(e){ btn.disabled = false; st.className="status err"; st.textContent="× Mtandao umekataa / Network error"; }
}

/* ── SIGNATURE PADS ── */
function initSig(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  c.width = c.offsetWidth * dpr;
  c.height = 130 * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = "#0B1F45";
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  let drawing = false, hasInk = false;
  function pos(e){
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasInk = true; e.preventDefault(); }
  function end(){ drawing = false; }
  c.addEventListener("mousedown", start); c.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
  c.addEventListener("touchstart", start, {passive:false}); c.addEventListener("touchmove", move, {passive:false}); c.addEventListener("touchend", end);
  sigPads[id] = { canvas: c, hasInk: () => hasInk, reset: () => { hasInk = false; } };
}
function clearSig(id){
  const p = sigPads[id];
  const ctx = p.canvas.getContext("2d");
  ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
  p.reset();
}

async function saveContract(){
  const st = document.getElementById("saveStatus");
  const d = DOCS[currentDoc];
  const formData = {};
  d.fields.forEach(f => { formData[f.k] = (document.getElementById("f_"+f.k)||{}).value || ""; });
  if(!formData.jina || !formData.jina.trim()){
    st.className = "status err"; st.textContent = "× Jaza jina la mfanyakazi / Enter employee name"; return;
  }
  if(!sigPads.sigEmployee.hasInk()){
    st.className = "status err"; st.textContent = "× Mfanyakazi lazima atie sahihi / Employee must sign"; return;
  }
  st.className = "status ok"; st.textContent = "Inahifadhi... / Saving...";
  const rec = {
    doc_type: currentDoc,
    employee_name: formData.jina.trim(),
    employee_phone: formData.simu || "",
    form_data: formData,
    employee_signature: sigPads.sigEmployee.canvas.toDataURL("image/png"),
    employer_signature: sigPads.sigEmployer.hasInk() ? sigPads.sigEmployer.canvas.toDataURL("image/png") : null,
  };
  try {
    const res = await fetch(SB_URL + "/rest/v1/signed_contracts", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, Prefer: "return=minimal" },
      body: JSON.stringify(rec)
    });
    if(res.ok){
      st.className = "status ok";
      st.textContent = "✓ Mkataba umehifadhiwa kikamilifu! / Contract saved successfully!";
      setTimeout(()=>renderForm(currentDoc), 2500);
    } else {
      const t = await res.text();
      st.className = "status err"; st.textContent = "× Hitilafu: " + t.slice(0,120);
    }
  } catch(e){
    st.className = "status err"; st.textContent = "× Mtandao umekataa / Network error: " + e.message;
  }
}

renderApply();
initLock();
checkHiring();
if(location.hash==="#sera"){ const sb=document.querySelector(".tabs button[data-doc=sera]"); if(sb) switchDoc("sera",sb); }
