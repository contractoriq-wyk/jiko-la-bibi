let currentDoc = "muda_mfupi";
let sigPads = {};

function switchDoc(doc, btn){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  currentDoc = doc;
  if(doc==="records"){
    document.getElementById("formArea").style.display="none";
    document.getElementById("recordsArea").style.display="block";
    loadRecords();
  } else {
    document.getElementById("formArea").style.display="block";
    document.getElementById("recordsArea").style.display="none";
    renderForm(doc);
  }
}

function renderForm(docKey){
  const d = DOCS[docKey];
  let fieldsHtml = d.fields.map(f=>{
    if(f.type==="select"){
      return `<label>${f.l}</label><select id="f_${f.k}">${f.opts.map(o=>`<option>${o}</option>`).join("")}</select>`;
    }
    return `<label>${f.l}</label><input id="f_${f.k}" type="${f.type||"text"}" placeholder="${f.l.replace(" *","")}">`;
  }).join("");

  document.getElementById("formArea").innerHTML = `
    <div class="card">
      <h2>${d.title}</h2>
      <h3>Taarifa / Details</h3>
      ${fieldsHtml}
      <h3>Masharti / Terms</h3>
      <div class="terms">${d.terms}</div>
      <h3>Sahihi ya Mfanyakazi / Employee Signature</h3>
      <div class="sig-area"><canvas id="sigEmployee"></canvas><button class="sig-clear no-print" onclick="clearSig('sigEmployee')">Futa</button></div>
      <h3>Sahihi ya Mwajiri / Employer Signature</h3>
      <div class="sig-area"><canvas id="sigEmployer"></canvas><button class="sig-clear no-print" onclick="clearSig('sigEmployer')">Futa</button></div>
      <button class="btn btn-gold no-print" onclick="saveContract()">💾 Hifadhi Mkataba / Save Contract</button>
      <button class="btn btn-grey no-print" onclick="window.print()">🖨️ Print / PDF (hiari)</button>
      <div class="status" id="saveStatus"></div>
    </div>`;
  initSig("sigEmployee");
  initSig("sigEmployer");
}

function initSig(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  c.width = c.offsetWidth * dpr;
  c.height = 130 * dpr;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.strokeStyle = "#0B1F45";
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  let drawing = false, hasInk = false;
  function pos(e){
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e){ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasInk = true; e.preventDefault(); }
  function end(){ drawing = false; }
  c.addEventListener("mousedown", start); c.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
  c.addEventListener("touchstart", start, {passive:false}); c.addEventListener("touchmove", move, {passive:false}); c.addEventListener("touchend", end);
  sigPads[id] = { canvas: c, hasInk: () => hasInk, reset: () => { hasInk = false; } };
}
function clearSig(id){
  const p = sigPads[id];
  const ctx = p.canvas.getContext("2d");
  ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
  p.reset();
}

async function saveContract(){
  const st = document.getElementById("saveStatus");
  const d = DOCS[currentDoc];
  const formData = {};
  d.fields.forEach(f => { formData[f.k] = (document.getElementById("f_"+f.k)||{}).value || ""; });
  if(!formData.jina || !formData.jina.trim()){
    st.className = "status err"; st.textContent = "× Jaza jina la mfanyakazi / Enter employee name"; return;
  }
  if(!sigPads.sigEmployee.hasInk()){
    st.className = "status err"; st.textContent = "× Mfanyakazi lazima atie sahihi / Employee must sign"; return;
  }
  st.className = "status ok"; st.textContent = "Inahifadhi... / Saving...";
  const rec = {
    doc_type: currentDoc,
    employee_name: formData.jina.trim(),
    employee_phone: formData.simu || "",
    form_data: formData,
    employee_signature: sigPads.sigEmployee.canvas.toDataURL("image/png"),
    employer_signature: sigPads.sigEmployer.hasInk() ? sigPads.sigEmployer.canvas.toDataURL("image/png") : null,
  };
  try {
    const res = await fetch(SB_URL + "/rest/v1/signed_contracts", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, Prefer: "return=minimal" },
      body: JSON.stringify(rec)
    });
    if(res.ok){
      st.className = "status ok";
      st.textContent = "✓ Mkataba umehifadhiwa kikamilifu! / Contract saved successfully!";
      setTimeout(()=>renderForm(currentDoc), 2500);
    } else {
      const t = await res.text();
      st.className = "status err"; st.textContent = "× Hitilafu: " + t.slice(0,120);
    }
  } catch(e){
    st.className = "status err"; st.textContent = "× Mtandao umekataa / Network error: " + e.message;
  }
}

const typeLabels = { muda_mfupi: "📄 Muda Mfupi", kudumu: "📜 Kudumu", sera: "📕 Sera" };
async function loadRecords(){
  const list = document.getElementById("recordsList");
  try {
    const res = await fetch(SB_URL + "/rest/v1/signed_contracts?select=id,doc_type,employee_name,employee_phone,signed_at&order=signed_at.desc&limit=100", {
      headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY }
    });
    const rows = await res.json();
    if(!rows.length){ list.innerHTML = '<p style="text-align:center;color:rgba(11,31,69,0.4);padding:20px;font-size:13px">Hakuna mikataba bado / No signed contracts yet</p>'; return; }
    list.innerHTML = rows.map(r => `
      <div class="rec">
        <div class="rec-icon">${(typeLabels[r.doc_type]||"📄").split(" ")[0]}</div>
        <div class="rec-info">
          <div class="rec-name">${r.employee_name}</div>
          <div class="rec-meta">${typeLabels[r.doc_type]||r.doc_type} · ${new Date(r.signed_at).toLocaleDateString("sw-TZ",{day:"numeric",month:"short",year:"numeric"})}${r.employee_phone?" · "+r.employee_phone:""}</div>
        </div>
        <button class="rec-btn" onclick="viewRecord('${r.id}')">Angalia</button>
      </div>`).join("");
  } catch(e){
    list.innerHTML = '<p style="text-align:center;color:#C62828;padding:20px;font-size:13px">Hitilafu ya mtandao / Network error</p>';
  }
}

      <h1>UNYAMWEZINI JIKO LA BIBI JJJ</h1>
      <p style="text-align:center;font-size:11px;color:#777">Mbezi Luis, Goba Road, Dar es Salaam · +255 655 709 024</p>

      <h2>Taarifa</h2><table>${fieldsHtml}</table>
      <h2>Masharti</h2><div class="terms">${d?d.terms:""}</div>
      <h2>Sahihi ya Mfanyakazi</h2>${r.employee_signature?`<img class="sig" src="${r.employee_signature}">`:"<p>—</p>"}
      <h2>Sahihi ya Mwajiri</h2>${r.employer_signature?`<img class="sig" src="${r.employer_signature}">`:"<p>—</p>"}
      <p style="margin-top:18px;font-size:12px;color:#777">Ilisainiwa: ${new Date(r.signed_at).toLocaleString("sw-TZ")}</p>
      <button onclick="window.print()" style="margin-top:20px;padding:12px 24px;background:#B8860B;color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer">🖨️ Print / Save PDF</button>
      </body></html>`);
    w.document.close();
  } catch(e){ alert("Hitilafu: " + e.message); }
}

renderForm("muda_mfupi");
</script>
